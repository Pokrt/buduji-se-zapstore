name: Buduji se Beta
summary: "Beta. A daily diary in three thirds: sleep, work and time for yourself. Inspired by Tomáš Baťa, backed by science."
description: |
    **Beta.** Works offline on your phone; with an account it syncs with the web app at app.buduji.se.

    A short daily log of your day in three thirds: sleep, work and time for yourself.

    - three priorities in the morning, three things I'm proud of in the evening
    - one-minute and twenty-minute habits, with no streaks and no penalty for a missed day
    - an eight-day recommended path, one topic a day, with a short story on why it works
    - sleep from Health Connect (optional, with consent)

    In English and Czech (follows the phone's language).

    ---

    **Beta verze.** Krátký denní zápis podle tří třetin dne: spánek, práce a čas pro sebe. Česky i anglicky.

