summary: "Test version. A daily diary in three thirds: sleep, work and time for yourself. Inspired by Tomáš Baťa, backed by science."
description: |
    **Test version.** Works offline on your phone; account sync is not open yet.

    A short daily log of your day in three thirds: sleep, work and time for yourself.

    - three priorities in the morning, three things I'm proud of in the evening
    - one-minute and twenty-minute habits, with no streaks and no penalty for a missed day
    - eight weeks, one new thing each week, with a short story on why it works
    - sleep from Health Connect (optional, with consent)

    In English and Czech (follows the phone's language).

    ---

    **Testovací verze.** Krátký denní zápis podle tří třetin dne: spánek, práce a čas pro sebe. Česky i anglicky.

